name: Deploy lab EC2

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag (default github.sha)
        required: false
        type: string
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

jobs:
  deploy:
    # Native arm64: EC2 lab is t4g. Compiling PHP extensions under QEMU on
    # ubuntu-latest (amd64) routinely takes 15–30+ minutes.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check AWS_ROLE_ARN secret
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          ROLE_ARN="$(printf '%s' "$ROLE_ARN" | tr -d '\r\n"' | sed "s/^[[:space:]]*//;s/[[:space:]]*$//")"
          EXPECTED='arn:aws:iam::502429879716:role/elearning-github-deploy'
          if [[ "$ROLE_ARN" == "$EXPECTED" ]]; then
            echo "ARN matches CDK output (length ${#ROLE_ARN})"
          else
            echo "::error::AWS_ROLE_ARN is invalid. Must be iam:: (TWO colons after iam) + 12-digit account + :role/name"
            echo "Paste exactly:"
            echo "${EXPECTED}"
            echo "Got length ${#ROLE_ARN} (correct ARN is ${#EXPECTED} chars)."
            echo "Common mistake: arn:aws:iam:ACCOUNT:... (one colon) instead of arn:aws:iam::ACCOUNT:..."
            exit 1
          fi

      - name: Show GitHub OIDC claims
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          req = urllib.request.Request(
              f"{url}{sep}audience=sts.amazonaws.com",
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
          ):
              print(f"{key}={claims.get(key)}")
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: elearning-gha-deploy

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read ECR URI
        id: meta
        run: |
          ECR_URI="$(aws ssm get-parameter --name /elearning/lab/ECR_URI --query Parameter.Value --output text)"
          INSTANCE_ID="$(aws ssm get-parameter --name /elearning/lab/EC2_INSTANCE_ID --query Parameter.Value --output text)"
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "ecr_uri=${ECR_URI}" >> "$GITHUB_OUTPUT"
          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.ecr_uri }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ecr_uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        run: |
          INSTANCE_ID="${{ steps.meta.outputs.instance_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          STATE="$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)"
          echo "Instance ${INSTANCE_ID} state=${STATE}"
          if [ "$STATE" != "running" ]; then
            echo "EC2 is not running (${STATE}). Image ${TAG} is in ECR."
            echo "Start the instance, then re-run this workflow or: sudo /opt/elearning/deploy.sh ${TAG}"
            exit 0
          fi
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "elearning deploy ${TAG}" \
            --parameters "{\"commands\":[\"/opt/elearning/deploy.sh ${TAG}\"]}" \
            --query Command.CommandId \
            --output text)"
          echo "SSM command ${COMMAND_ID}"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
