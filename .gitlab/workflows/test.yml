test:php:
  extends: .php
  stage: test
  needs:
    - lint:php
  before_script:
    - !reference [.php, before_script]
    - cp .env.example .env
    - php artisan key:generate
  script:
    - composer types:check
    - php artisan test --compact --log-junit junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: junit.xml
    paths:
      - junit.xml
