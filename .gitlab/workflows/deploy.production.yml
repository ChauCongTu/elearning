deploy:production:
  extends: .oidc_aws
  stage: deploy
  interruptible: false
  resource_group: deploy-production
  environment:
    name: production
  needs:
    - job: lint:php
    - job: lint:frontend
    - job: test:php
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -euo pipefail
      STATE="$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" \
        --query 'Reservations[0].Instances[0].State.Name' --output text)"
      echo "Instance ${EC2_INSTANCE_ID} state=${STATE}"
      if [ "$STATE" != "running" ]; then
        echo "EC2 not running (${STATE}). Start instance then re-run pipeline."
        exit 0
      fi
      COMMAND_ID="$(aws ssm send-command \
        --instance-ids "$EC2_INSTANCE_ID" \
        --document-name AWS-RunShellScript \
        --timeout-seconds 2400 \
        --comment "elearning production ${CI_COMMIT_SHA}" \
        --parameters '{"commands":["bash /deploy/elearning.sh"]}' \
        --query Command.CommandId --output text)"
      echo "SSM command ${COMMAND_ID}"
      for _ in $(seq 1 80); do
        STATUS="$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID" \
          --query Status --output text)"
        echo "SSM status=${STATUS}"
        case "$STATUS" in
          Success)
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
            exit 0
            ;;
          Failed|Cancelled|TimedOut|Undeliverable)
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}'
            exit 1
            ;;
        esac
        sleep 15
      done
      echo "Timed out waiting for SSM command ${COMMAND_ID}"
      exit 1
