<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Kiến thức">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="55%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00000022"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="680" cy="90" r="120" fill="#ffffff33"/>
  <circle cx="120" cy="360" r="90" fill="#ffffff22"/>
  <rect x="48" y="300" width="520" height="96" rx="20" fill="#ffffffcc" filter="url(#shadow)"/>
  <text x="72" y="345" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#374151">Tin tức & kiến thức</text>
  <text x="72" y="378" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="16" fill="#6b7280">Học Viện Bông Nhài Trắng</text>
</svg>